<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Canvas background with soft rounded corners -->
  <rect width="100" height="100" rx="22" fill="#ffffff"/>
  
  <!-- Main Hand Silhouette in Coral Red -->
  <g id="hand-group">
    <!-- Pinky Finger -->
    <rect x="26" y="24" width="8" height="26" rx="4" fill="#f05a4b"/>
    <!-- Ring Finger -->
    <rect x="35" y="16" width="8" height="34" rx="4" fill="#f05a4b"/>
    <!-- Middle Finger -->
    <rect x="44" y="12" width="8" height="38" rx="4" fill="#f05a4b"/>
    <!-- Index Finger -->
    <rect x="53" y="18" width="8" height="32" rx="4" fill="#f05a4b"/>
    <!-- Palm & Wrist Base -->
    <path d="M 26,42 L 61,42 C 61,42 61,72 61,74 L 26,74 Z" fill="#f05a4b"/>
    
    <!-- Skin Lesion Contour on lower palm (White contour) -->
    <path d="M 26,56 Q 30,52 32,57 T 35,66 Q 30,70 26,67 Z" fill="#ffffff"/>
  </g>

  <!-- Diagnostic Magnifying Glass Inspection -->
  <g id="magnifier-group">
    <!-- Lens Interior Skin Inspection Area (Coral Red inside Lens) -->
    <circle cx="56" cy="52" r="16" fill="#f05a4b"/>
    
    <!-- White Clinical Diagnostic Dots inside Lens -->
    <circle cx="50" cy="46" r="1.8" fill="#ffffff"/>
    <circle cx="56" cy="44" r="2.2" fill="#ffffff"/>
    <circle cx="62" cy="48" r="1.5" fill="#ffffff"/>
    <circle cx="48" cy="52" r="2.0" fill="#ffffff"/>
    <circle cx="54" cy="54" r="2.5" fill="#ffffff"/>
    <circle cx="60" cy="56" r="1.8" fill="#ffffff"/>
    <circle cx="52" cy="60" r="2.0" fill="#ffffff"/>

    <!-- Magnifying Glass Dark Navy Outer Ring -->
    <circle cx="56" cy="52" r="16" fill="none" stroke="#1d283c" stroke-width="5"/>

    <!-- Magnifying Glass Dark Navy Handle -->
    <line x1="68" y1="64" x2="80" y2="76" stroke="#1d283c" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
